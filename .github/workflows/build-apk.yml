name: Bangun APK Dhiyaul Umma

on:
  workflow_dispatch: {}

env:
  APP_DIR: dhiyaul-umma/dhiyaul-umma

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhiyaul-umma/dhiyaul-umma
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Unduh library web
        run: |
          mkdir -p vendor
          curl -fsSL https://cdn.tailwindcss.com -o vendor/tailwind.js
          curl -fsSL https://unpkg.com/lucide@latest -o vendor/lucide.js

      - name: Siapkan folder www
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest sw.js assets vendor www/

      - run: npm install
      - run: npx cap add android
      - run: bash tools/configure-android.sh
      - run: npx cap sync android

      - name: Bangun APK
        working-directory: dhiyaul-umma/dhiyaul-umma/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dhiyaul-umma-apk
          path: dhiyaul-umma/dhiyaul-umma/android/app/build/outputs/apk/debug/app-debug.apk
