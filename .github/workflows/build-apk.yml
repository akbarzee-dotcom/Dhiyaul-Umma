name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Android
        run: |
          if [ -d "dhiyaul-umma/dhiyaul-umma" ]; then
            cd dhiyaul-umma/dhiyaul-umma
          fi
          [ -f paket.json ] && mv paket.json package.json || true
          [ -f kapasitor.config.json ] && mv kapasitor.config.json capacitor.config.json || true
          [ -f indeks.html ] && mv indeks.html index.html || true
          [ -d peralatan ] && mv peralatan tools || true
          [ -d aktiva ] && mv aktiva assets || true

          mkdir -p www
          cp -f index.html www/ 2>/dev/null || true
          cp -f manifest.webmanifest sw.js www/ 2>/dev/null || true
          cp -rf assets www/ 2>/dev/null || true

          npm install
          npx cap add android || true
          [ -f tools/configure-android.sh ] && bash tools/configure-android.sh || true
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhiyaul-ummah-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
